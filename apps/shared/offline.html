<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SYNAPSE</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: radial-gradient(40% 35% at 30% 35%, rgba(255,255,255,.08), transparent 70%), #000000;
      color: #c3c0b6; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    .card { max-width: 380px; }
    svg { width: 56px; height: 56px; color: #fafafa; }
    h1 { margin: 18px 0 6px; font: 600 22px Georgia, serif; color: #faf9f5; }
    p { margin: 0 0 20px; }
    button {
      border: 0; border-radius: 12px; padding: 11px 22px; background: #fafafa; color: #0a0a0a;
      font: 600 15px system-ui, sans-serif; cursor: pointer;
    }
    small { display: block; margin-top: 28px; color: #83827d; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <line x1="16" y1="11.6" x2="16" y2="6.4"/><line x1="19.81" y1="13.8" x2="24.31" y2="11.2"/><line x1="19.81" y1="18.2" x2="24.31" y2="20.8"/>
      <line x1="16" y1="20.4" x2="16" y2="25.6"/><line x1="12.19" y1="18.2" x2="7.69" y2="20.8"/><line x1="12.19" y1="13.8" x2="7.69" y2="11.2"/>
      <circle cx="16" cy="3.8" r="2.4" stroke="none"/><circle cx="26.57" cy="9.9" r="1.8" stroke="none"/><circle cx="26.57" cy="22.1" r="2.4" stroke="none"/>
      <circle cx="16" cy="28.2" r="1.8" stroke="none"/><circle cx="5.43" cy="22.1" r="2.4" stroke="none"/><circle cx="5.43" cy="9.9" r="1.8" stroke="none"/>
      <circle cx="16" cy="16" r="3" stroke="none"/>
    </svg>
    <h1 id="title">Can't reach SYNAPSE</h1>
    <p id="message">Check your internet connection and try again.</p>
    <button onclick="location.href = (new URLSearchParams(location.search).get('retry') || location.href)">Try again</button>
    <small>SYNAPSE · Created by Revoori Ashwath Reddy · HumanForm Studios</small>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("reason") === "not-configured") {
      document.getElementById("title").textContent = "SYNAPSE isn't connected yet";
      document.getElementById("message").textContent =
        "This app opens the SYNAPSE website, which hasn't been published yet. Please check back soon.";
      document.querySelector("button").style.display = "none";
    }
  </script>
</body>
</html>
